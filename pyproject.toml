[project]
name = "mofi"
version = "0.3.0"
description = "Framework-native Ko-fi payment webhook handling for Python"
authors = [{ name = "Jedddy", email = "jedbalita25@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.109,<1",
    "python-multipart>=0.0.6,<1",
]
flask = [
    "flask[async]>=3.1,<4",
]
django = [
    "django>=5.2,<6",
]
all = [
    "fastapi>=0.109,<1",
    "python-multipart>=0.0.6,<1",
    "flask[async]>=3.1,<4",
    "django>=5.2,<6",
]

[dependency-groups]
dev = [
    "httpx>=0.26,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "uvicorn>=0.25,<1",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-p no:warnings"
testpaths = [
    "tests",
]
